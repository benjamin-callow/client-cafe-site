<!DOCTYPE html>
<!-- KangaCafe starter template.
     Copy this file to create menu.html, about.html and contact.html. -->
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<!-- Change the title on each page -->
	<title>Home | KangaCafe</title>

	<!-- Links to the shared stylesheet. Keep this on every page. -->
	<link rel="stylesheet" href="style.css">
</head>

<body>

	<!-- Header: insert the logo here and link it to the Home page.
       Keep on every page. -->
	<header>
		<a href="index.html" class="logo">
			<img src="images/kanga-cafe-logo.png" alt="Kanga Cafe Logo" class="logo">
		</a>
	</header>

	<!-- Navigation: replace each # with the correct page link.
       Move class="active" to the link for the current page. -->
	<nav>
		<ul>
			<li><a href="index.html" class="active">Home</a></li>
			<li><a href="menu.html">Menu</a></li>
			<li><a href="about.html">About Us</a></li>
			<li><a href="contact.html">Contact</a></li>
		</ul>
	</nav>

	<main>
		<h1>Kanga Life Cafe Home</h1>
		<section>
			<h2>Menu</h2>
			<p>You can find our menu <a href="menu.html">here!</a></p>
		</section>

		<section>
			<h2>Location</h2>
			<p>You can find our cafe at 123 High Street, Bendigo Victoria</p>
			<!--google maps API-->
			<iframe
				src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3196.3681867427745!2d144.27024487589674!3d-36.7617338746496!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x6ad759f0528f53ab%3A0x6cae6c07fd5bcd6e!2s123%20High%20St%2C%20Bendigo%20VIC%203550!5e0!3m2!1sen!2sau!4v1795736362162!5m2!1sen!2sau"
				width="400" height="300" style="border:0;" allowfullscreen="" loading="lazy"
				referrerpolicy="strict-origin-when-cross-origin"></iframe>
		</section>


		<section>
			<h2>Opening Times</h2>

			<!-- Table of Opening Times 
				Times still to be inserted in # position -->

			<table>
				<tr>
					<th>Monday - Friday</th>
					<th>7:00am - 4:00pm</th>
				</tr>

				<tr>
					<th>Saturday</th>
					<th>8:00am - 3:00pm</th>
				</tr>

				<tr>
					<th>Sunday</th>
					<th>8:00am - 2:00pm</th>
				</tr>
			</table>

		</section>

	</main>

	<!-- Footer: add the footer text from the client's email. Keep on every page. -->
	<footer>
		<p>&copy; 2026 KangaCafe</p>
	</footer>

</body>

</html>
